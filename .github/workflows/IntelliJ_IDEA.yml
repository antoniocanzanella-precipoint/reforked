name: Reforked
on:
  # we have to run on push for all release branches and pull_request for everything else to avoid github's "feature" where it
  # runs the CI on the merged state but also if there are conflicts it just silently doesn't run anything and doesn't tell you why...
  push:
    branches:
      - master
      - release/*

  # we only run on pull_request when the source branch name doesn't start with "release/". unfortunately branches-ignore refers to
  # the source branch not the target branch so we can't do that here. we use an `if` statement in the get_version job instead
  pull_request:

  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'build number'
        required: true
      unsigned_shell_test:
        type: boolean
        description: 'Include the unsigned Windows 11 menu test package (administrator permission required; keep this release as a draft)'
        default: false

permissions:
  contents: read

jobs:
  get_version:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release/')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      build_version: ${{ steps.get_version.outputs.build_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test release preparation
        run: |
          node --test .github/scripts/prepare-release.test.mjs .github/scripts/release-version.test.mjs \
            .github/scripts/verify-bundled-plugins.test.mjs
          python3 .github/scripts/verify-windows-shell.test.py
      - name: get build number
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release-version.mjs
      - name: Require consent for the unsigned test package
        if: github.event_name == 'workflow_dispatch' && !inputs.unsigned_shell_test
        run: |
          echo 'Enable unsigned_shell_test for this draft prerelease. A trusted signing setup is required for public distribution.' >&2
          exit 1

  build:
    needs: get_version
    uses: ./.github/workflows/ide_build_and_upload.yml
    secrets: inherit
    with:
      artifacts_dir: out/idea-ce/artifacts
      product: intellij_idea
      version: ${{ needs.get_version.outputs.build_version }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - get_version
      - build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4.1.8
        with:
          path: artifacts

      - name: Check and collect release assets
        run: node .github/scripts/prepare-release.mjs artifacts release-assets

      - name: Describe the test package
        run: |
          cat > release-notes.md <<'EOF'
          This draft prerelease includes an unsigned Windows 11 context-menu test package.
          Install it from an administrator account and approve that account's permission prompt.
          Keep this release as a draft for testing.
          A trusted signing certificate is required before broad distribution.

          Changes include the first Explorer context menu, Open with support for 218 technical file types,
          and the larger Git-branch logo throughout the application and installers.
          EOF

      - name: Create Release
        # the maintainer said they archived this action because "there are much better alternatives these days"
        # but i have yet to find a single alternative that works the way i want (automatically creates the tag)
        uses: marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0 # zizmor: ignore[archived-uses]
        with:
          title: ${{ needs.get_version.outputs.version }}
          automatic_release_tag: ${{ needs.get_version.outputs.version }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ github.repository != 'DetachHead/rebased' }}
          draft: true
          files: release-assets/*
      - name: Add the test package notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.get_version.outputs.version }}
        run: gh release edit "$RELEASE_VERSION" --notes-file release-notes.md
