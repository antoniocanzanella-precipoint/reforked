name: IDE Build and Upload

on:
  workflow_call:
    inputs:
      product:
        description: 'a product, available options: intellij_idea, pycharm'
        type: string
        required: true
      artifacts_dir:
        description: 'artifacts directory'
        type: string
        required: true
      version:
        type: string
        required: true

permissions: {}

jobs:
  windows-shell:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            directory: amd64
          - architecture: arm64
            directory: aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test Windows package registration policy
        if: matrix.architecture == 'x64'
        shell: powershell
        run: ./native/WinExplorerCommand/package-policy.tests.ps1
      - name: Build the Windows 11 menu test package
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
          SHELL_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $version = $env:BUILD_VERSION -replace '\.SNAPSHOT$', '.0.0.0'
          ./native/WinExplorerCommand/build.ps1 -Architecture $env:SHELL_ARCHITECTURE -Version $version -UnsignedTest
      - name: Upload the Windows 11 menu package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reforked-shell-${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 1
          path: |
            out/reforked-shell/${{ matrix.directory }}/reforked-shell.dll
            out/reforked-shell/${{ matrix.directory }}/reforked-shell.msix
            out/reforked-shell/${{ matrix.directory }}/reforked-shell.png

  distributions:
    runs-on: ubuntu-latest
    needs: windows-shell
    outputs:
      unsigned-windows-artifact-id-x64: ${{ steps.upload-unsigned-artifact-x64.outputs.artifact-id }}
      unsigned-windows-artifact-id-aarch64: ${{ steps.upload-unsigned-artifact-aarch64.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the Windows 11 menu packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: reforked-shell-*
          path: out/reforked-shell-download
      - name: Check both Windows menu packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            mkdir -p "out/reforked-shell/$arch"
            for name in reforked-shell.dll reforked-shell.msix reforked-shell.png; do
              source="out/reforked-shell-download/reforked-shell-$arch/$name"
              test -s "$source"
              cp "$source" "out/reforked-shell/$arch/$name"
            done
          done
      - uses: ./.github/actions/build_ide
        with:
          product: ${{inputs.product}}
          version: ${{inputs.version}}
          windows_shell_root: /community/out/reforked-shell
      - name: Check all bundled plugins
        if: inputs.product == 'intellij_idea'
        env:
          ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        run: node .github/scripts/verify-bundled-plugins.mjs "$ARTIFACTS_DIR"
      - name: Check the bundled Windows menu packages
        env:
          ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        run: python3 .github/scripts/verify-windows-shell.py "$ARTIFACTS_DIR"
      - name: upload-linux-x64
        uses: ./.github/actions/upload_ide
        with:
          os: linux
          suffix: .tar.gz
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-linux-aarch64
        uses: ./.github/actions/upload_ide
        with:
          os: linux
          suffix: -aarch64.tar.gz
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-windows-installer-x64
        uses: ./.github/actions/upload_ide
        id: upload-unsigned-artifact-x64
        with:
          os: windows
          suffix: .exe
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-windows-zip-x64
        uses: ./.github/actions/upload_ide
        with:
          os: windows
          suffix: .win.zip
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-windows-installer-aarch64
        uses: ./.github/actions/upload_ide
        id: upload-unsigned-artifact-aarch64
        with:
          os: windows
          suffix: -aarch64.exe
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-windows-zip-aarch64
        uses: ./.github/actions/upload_ide
        with:
          os: windows
          suffix: -aarch64.win.zip
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-mac-aarch64
        uses: ./.github/actions/upload_ide
        with:
          os: mac
          suffix: -aarch64.sit
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: upload-mac-x86
        uses: ./.github/actions/upload_ide
        with:
          os: mac
          suffix: .sit
          artifacts_dir: ${{inputs.artifacts_dir}}
      - name: Upload .dmg build scripts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dmg-build-scripts
          if-no-files-found: 'error'
          retention-days: 1
          path: ${{inputs.artifacts_dir}}/macos-dmg-build/
  dmg:
    strategy:
      matrix:
        suffix:
          - '-aarch64'
          - ''
    runs-on: macos-latest
    needs: distributions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download .dmg build scripts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dmg-build-scripts
      - name: Download ${{ matrix.suffix }}.sit
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mac${{ matrix.suffix }}.sit-unsigned
      - name: Build ${{ matrix.suffix }}.dmg
        shell: bash
        # language=bash
        run: /bin/bash ./build.sh
      - name: Upload .dmg
        uses: ./.github/actions/upload_ide
        with:
          os: mac
          suffix: ${{ matrix.suffix }}.dmg
          artifacts_dir: .
  build-appimage:
    strategy:
      matrix:
        # appimagetool expects a different format for the architecture so we need two variables
        arch:
          - suffix: ""
            appimage: x86_64
          - suffix: "-aarch64"
            appimage: aarch64
    runs-on: ubuntu-latest
    needs: distributions
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Download .tar.gz
        uses: actions/download-artifact@v4.1.8
        with:
          name: linux${{ matrix.arch.suffix }}.tar.gz-unsigned

      - name: Extract tar.gz
        run: |
          mkdir -p appdir/usr/bin
          tar -xzf *.tar.gz -C appdir/usr/ --strip-components=1

      - name: Prepare AppDir
        # language=bash
        run: |
          # AppRun file
          cat > appdir/AppRun <<'EOF'
          #!/bin/bash
          export IDEA_RESTART_VIA_EXIT_CODE=88
          while true; do
            "$APPDIR/usr/bin/reforked" "$@"
            exit_code=$?
            if [ "$exit_code" -ne "$IDEA_RESTART_VIA_EXIT_CODE" ]; then
              exit "$exit_code"
            fi
          done
          EOF
          chmod +x appdir/AppRun
          
          # Desktop file
          cat > appdir/reforked.desktop <<'EOF'
          [Desktop Entry]
          Name=Reforked
          Exec=AppRun
          Icon=reforked
          Type=Application
          Categories=Development;IDE;
          Terminal=false
          StartupWMClass=jetbrains-reforked
          StartupNotify=true
          X-AppImage-Version=${{inputs.version}}
          EOF
          
          # icon
          ln -s usr/bin/reforked.png appdir/reforked.png

      - name: Install appimagetool
        # this sucks. bash is the worst language ever made. appimagetool should be available on a package manager with lockfile support
        env:
          filename: "appimagetool-x86_64.AppImage"
          sha256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        # language=bash
        run: |
          set -euo pipefail # work properly flags! we don't want to risk running it even if the validation fails
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/$filename
          echo "$sha256 $filename" | sha256sum -c
          chmod +x $filename
          mv $filename ./appimagetool

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.arch.appimage }}
        # language=bash
        run: ./appimagetool appdir -u "gh-releases-zsync|$GITHUB_REPOSITORY_OWNER|${GITHUB_REPOSITORY#*/}|latest|Reforked-${{ matrix.arch.appimage }}.AppImage.zsync"

      - name: Upload .AppImage
        uses: ./.github/actions/upload_ide
        with:
          os: linux
          suffix: -${{ matrix.arch.appimage }}.AppImage
          artifacts_dir: .
  sign-windows-exe:
    if: github.repository == 'DetachHead/rebased'
    runs-on: ubuntu-latest
    needs: distributions
    strategy:
      matrix:
        arch:
          - name: x64
            artifact-id: ${{ needs.distributions.outputs.unsigned-windows-artifact-id-x64 }}
          - name: aarch64
            artifact-id: ${{ needs.distributions.outputs.unsigned-windows-artifact-id-aarch64 }}
    steps:
      - name: submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '6fa8204e-d307-43a0-bd8b-39b0883fc150'
          project-slug: 'rebased'
          # only use the real signing policy if doing a release, since it needs to be manually approved
          signing-policy-slug: ${{(github.event_name == 'workflow_dispatch' && 'release-signing') || 'test-signing' }}
          github-artifact-id: '${{ matrix.arch.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-exe'
          # 2 hours if release signing policy because it requires manual approval, otherwise 10 minutes (the default)
          wait-for-completion-timeout-in-seconds: ${{(github.event_name == 'workflow_dispatch' && '7200') || '600' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: windows-signed-${{ matrix.arch.name }}
          if-no-files-found: 'error'
          retention-days: 1
          path: 'signed-exe/*'
