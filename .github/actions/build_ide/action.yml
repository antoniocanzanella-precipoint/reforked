name: Build Reforked
description: Build the desktop packages for Reforked.
inputs:
  product:
    description: 'a product, available options: intellij_idea, pycharm'
    required: true
  version:
    description: 'build number'
    required: true
  windows_shell_root:
    description: 'directory containing the Windows menu packages inside the build container'
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/free_disk_space_and_expand_swap
    - name: Build environment
      shell: bash
      env:
        product: ${{inputs.product}}
      # language=bash
      run: docker build . --target $product --tag $product
    - name: Build
      shell: bash
      env:
        product: ${{inputs.product}}
        version: ${{inputs.version}}
        windows_shell_root: ${{inputs.windows_shell_root}}
      # language=bash
      run: |
        args=("-Dbuild.version=$version")
        if [ -n "$windows_shell_root" ]; then
          args+=("-Dintellij.build.reforked.windows.shell.root=$windows_shell_root")
        fi
        docker run --rm --user "$(id -u)" --volume "${PWD}:/community" "$product" "${args[@]}"
