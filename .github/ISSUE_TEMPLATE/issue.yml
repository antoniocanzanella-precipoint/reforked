name: New issue
description: A generic issue
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or feature for Reforked in English.
        AI assistance is welcome.
        Include the application version, operating system, and steps to reproduce a problem.
        Link any related issue in upstream Rebased or [YouTrack](https://youtrack.jetbrains.com).
  - type: textarea
    validations:
      required: false
    attributes:
      label: Description
      description: A description of the issue
